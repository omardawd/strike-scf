name: CodeQL

# Static analysis (SAST) for JS/TS. Separate workflow from ci.yml because it
# needs the security-events: write permission to publish results to GitHub's
# code scanning UI — kept isolated so ci.yml's other jobs stay minimum-
# permission (contents: read only).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catches new CodeQL query/vulnerability definitions even on weeks with
    # no code changes — GitHub's own recommended pattern for this workflow.
    - cron: '0 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
